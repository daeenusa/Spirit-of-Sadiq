        const baiatEthnicity = document.getElementById('fBaiatEthnicity').value;
        const baiatMotivation = document.getElementById('fBaiatMotivation').value.trim();
        const nextFollowUp = document.getElementById('fNextFollowUp').value;
        const source = document.getElementById('fSource').value.trim();
        if(!name){ alert('Please enter a name.'); return; }
        b.disabled = true; b.textContent = 'Saving\u2026';
        const editId = b.getAttribute('data-editid');
        const list = state.contactsD[daeenId] || (state.contactsD[daeenId]=[]);
        const fields = {name,notes,stage,lastContact,method,baiatAge,baiatCity,baiatFormConfirmed,baiatAdditionalInfo,baiatMetInPerson,baiatFaithAtBaiat,baiatFaithAtBirth,baiatGender,baiatEthnicity,baiatMotivation,nextFollowUp,source};
        if(editId){
          const c = list.find(x=>x.id===editId);
          if(c){ Object.assign(c, fields); stampBaiat(c, lastContact); stampHistory(c, lastContact); }
          state.editingDaeenContactId = null;
        } else {
          const c = Object.assign({id:uid(), created: todayStr()}, fields);
          stampBaiat(c, lastContact); stampHistory(c, lastContact);
          list.push(c);
          state.addingDaeenContact = null;
        }
        saveContactsD(daeenId).then(render);
      });
    });

    const copyBtn = document.getElementById('copySummaryBtn');
    if(copyBtn){
      copyBtn.addEventListener('click', ()=>{
        const text = summaryText(state.tab==='reportMonthly' ? 'month' : 'week');
        const card = document.getElementById('summaryCard');
        const box = document.getElementById('summaryText');
        card.style.display = 'block';
        box.textContent = text;
        if(navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
      });
    }

    const mNameInput = document.getElementById('mName');
    if(mNameInput) mNameInput.addEventListener('input', e=>{ state.newName = e.target.value; });
    const addMissionaryBtn = document.getElementById('addMissionaryBtn');
    if(addMissionaryBtn) addMissionaryBtn.addEventListener('click', addMissionaryAdmin);
    root.querySelectorAll('[data-action="removeMissionary"]').forEach(b=> b.addEventListener('click', ()=> removeMissionaryAdmin(b.getAttribute('data-id'))));
    root.querySelectorAll('[data-action="resetMissionaryPassword"]').forEach(b=> b.addEventListener('click', ()=> resetMissionaryPassword(b.getAttribute('data-id'))));
    root.querySelectorAll('[data-action="toggleRL"]').forEach(cb=> cb.addEventListener('change', ()=> toggleRegionalLeader(cb.getAttribute('data-id'))));
    root.querySelectorAll('[data-action="assignRL"]').forEach(sel=> sel.addEventListener('change', e=> assignRegionalLeader(sel.getAttribute('data-id'), e.target.value)));

    const bulkText = document.getElementById('bulkText');
    if(bulkText) bulkText.addEventListener('input', e=>{ state.bulkImportText = e.target.value; });
    const previewImportBtn = document.getElementById('previewImportBtn');
    if(previewImportBtn) previewImportBtn.addEventListener('click', previewImport);
    const confirmImportBtn = document.getElementById('confirmImportBtn');
    if(confirmImportBtn) confirmImportBtn.addEventListener('click', confirmImport);
    const cancelImportBtn = document.getElementById('cancelImportBtn');
    if(cancelImportBtn) cancelImportBtn.addEventListener('click', cancelImport);

    const bulkMissionaryTextArea = document.getElementById('bulkMissionaryTextArea');
    if(bulkMissionaryTextArea) bulkMissionaryTextArea.addEventListener('input', e=>{ state.bulkMissionaryText = e.target.value; });
    const previewMissionaryImportBtn = document.getElementById('previewMissionaryImportBtn');
    if(previewMissionaryImportBtn) previewMissionaryImportBtn.addEventListener('click', previewImportMissionaries);
    const confirmMissionaryImportBtn = document.getElementById('confirmMissionaryImportBtn');
    if(confirmMissionaryImportBtn) confirmMissionaryImportBtn.addEventListener('click', confirmImportMissionaries);
    const cancelMissionaryImportBtn = document.getElementById('cancelMissionaryImportBtn');
    if(cancelMissionaryImportBtn) cancelMissionaryImportBtn.addEventListener('click', cancelImportMissionaries);

    const filterUnassigned = document.getElementById('filterUnassigned');
    if(filterUnassigned) filterUnassigned.addEventListener('change', e=>{ state.daeenFilterUnassigned = e.target.checked; render(); });
    const filterNotContacted = document.getElementById('filterNotContacted');
    if(filterNotContacted) filterNotContacted.addEventListener('change', e=>{ state.daeenFilterNotContacted = e.target.checked; render(); });
    const adminDaeenSearch = document.getElementById('adminDaeenSearch');
    if(adminDaeenSearch) adminDaeenSearch.addEventListener('input', e=>{ state.searchText = e.target.value; render(); });
    root.querySelectorAll('[data-action="reassign"]').forEach(sel=> sel.addEventListener('change', e=>{ reassignDaeen(sel.getAttribute('data-id'), e.target.value); }));
    root.querySelectorAll('[data-action="reassignContactAdmin"]').forEach(sel=> sel.addEventListener('change', e=>{
      reassignContactAdmin(sel.getAttribute('data-contactid'), sel.getAttribute('data-sourcetype'), sel.getAttribute('data-sourceid'), e.target.value);
    }));
    root.querySelectorAll('[data-action="updateBaiatStatus"]').forEach(sel=> sel.addEventListener('change', e=>{
      if(!confirm('Change this person\u2019s stage? If moved away from Bai\u2019at, they\u2019ll disappear from this list.')){ render(); return; }
      updateBaiatStatusAdmin(sel.getAttribute('data-contactid'), sel.getAttribute('data-sourcetype'), sel.getAttribute('data-sourceid'), e.target.value);
    }));
    const baiatFilterRegion = document.getElementById('baiatFilterRegion');
    if(baiatFilterRegion) baiatFilterRegion.addEventListener('change', e=>{ state.baiatFilterRegion = e.target.value; render(); });
    const baiatFilterMissionary = document.getElementById('baiatFilterMissionary');
    if(baiatFilterMissionary) baiatFilterMissionary.addEventListener('change', e=>{ state.baiatFilterMissionary = e.target.value; render(); });
    const baiatFilterAuxiliary = document.getElementById('baiatFilterAuxiliary');
    if(baiatFilterAuxiliary) baiatFilterAuxiliary.addEventListener('change', e=>{ state.baiatFilterAuxiliary = e.target.value; render(); });
    const baiatFilterGender = document.getElementById('baiatFilterGender');
    if(baiatFilterGender) baiatFilterGender.addEventListener('change', e=>{ state.baiatFilterGender = e.target.value; render(); });
    const baiatFilterMonth = document.getElementById('baiatFilterMonth');
    if(baiatFilterMonth) baiatFilterMonth.addEventListener('change', e=>{ state.baiatFilterMonth = e.target.value; render(); });
    root.querySelectorAll('[data-action="removeDaeen"]').forEach(b=> b.addEventListener('click', ()=> removeDaeenAdmin(b.getAttribute('data-id'))));

    const addAdminMemberBtn = document.getElementById('addAdminMemberBtn');
    if(addAdminMemberBtn) addAdminMemberBtn.addEventListener('click', ()=>{ state.addingAdminMember=true; state.newName=''; state.newPasswordInput=''; state.error=''; render(); });
    const cancelAddAdminBtn = document.getElementById('cancelAddAdminBtn');
    if(cancelAddAdminBtn) cancelAddAdminBtn.addEventListener('click', ()=>{ state.addingAdminMember=false; state.error=''; render(); });
    const confirmAddAdminBtn = document.getElementById('confirmAddAdminBtn');
    if(confirmAddAdminBtn) confirmAddAdminBtn.addEventListener('click', confirmAddAdmin);
    const newAdminName = document.getElementById('newAdminName');
    if(newAdminName) newAdminName.addEventListener('input', e=>{ state.newName = e.target.value; });
    const newAdminPassword = document.getElementById('newAdminPassword');
    if(newAdminPassword) newAdminPassword.addEventListener('input', e=>{ state.newPasswordInput = e.target.value; });

    const exportBackupBtn = document.getElementById('exportBackupBtn');
    if(exportBackupBtn) exportBackupBtn.addEventListener('click', exportBackup);
    const importFileInput = document.getElementById('importFileInput');
    if(importFileInput){
      importFileInput.addEventListener('change', e=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev=>{
          let data;
          try{ data = JSON.parse(ev.target.result); }
          catch(err){ state.error = 'That file is not valid JSON.'; render(); return; }
          const typed = prompt('This will REPLACE ALL current data with this backup (from ' + (data.exportedAt||'an unknown date') + '). This cannot be undone.\n\nType RESTORE (all caps) to confirm:');
          if(typed !== 'RESTORE'){ e.target.value=''; return; }
          importBackup(data);
        };
        reader.readAsText(file);
      });
    }
  }

  document.addEventListener('click', ()=>{
    document.querySelectorAll('.badge-tooltip.show').forEach(t=> t.classList.remove('show'));
  });

  loadAll();
})();
</script>
</body>
</html>
