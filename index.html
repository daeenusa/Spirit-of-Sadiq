<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spirit of Sadiq</title>
<style>
  :root{
    --bg:#F3F4F6;
    --surface:#FFFFFF;
    --surface-alt:#F7F8FA;
    --border:#E1E4E9;
    --text:#12151C;
    --text-muted:#697180;
    --accent:#0D9488;
    --accent-deep:#0B7A70;
    --accent-soft:#E6F5F3;
    --warn:#DC2626;
    --warn-soft:#FDECEC;
    --caution:#B45309;
    --good:#16A34A;
    --good-soft:#E8F8ED;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased;}
  .app{max-width:900px; margin:0 auto; padding:22px 16px 60px;}

  header.top{display:flex; align-items:flex-start; justify-content:space-between; padding-bottom:18px; margin-bottom:20px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px;}
  .brand{font-size:25px; font-weight:800; letter-spacing:-0.01em; color:var(--text);}
  .brand small{display:block; font-size:10.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent-deep); margin-top:3px;}
  .identity{text-align:right; font-size:13px; color:var(--text-muted);}
  .identity .role-tag{display:inline-block; font-size:10px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--accent-deep); background:var(--accent-soft); padding:2px 8px; border-radius:5px;}
  .identity .who{color:var(--text); font-weight:700; font-size:14px; margin-top:5px;}
  .identity button{background:none; border:none; color:var(--accent-deep); font-size:11.5px; font-weight:600; cursor:pointer; padding:0; margin-top:5px;}

  nav.tabs{display:flex; gap:2px; margin-bottom:22px; border-bottom:1px solid var(--border); overflow-x:auto;}
  nav.tabs button{background:none; border:none; border-bottom:2px solid transparent; color:var(--text-muted); font-size:12.5px; font-weight:600; padding:11px 13px; cursor:pointer; white-space:nowrap;}
  nav.tabs button.active{color:var(--accent-deep); border-bottom-color:var(--accent);}
  nav.tabs button:hover:not(.active){color:var(--text);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 22px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,0.03), 0 6px 20px rgba(16,24,32,0.05);}
  .card h2{font-size:16px; font-weight:800; letter-spacing:-0.01em; margin:0 0 4px; color:var(--text);}
  .section-title{font-size:15.5px; font-weight:800; letter-spacing:-0.01em; color:var(--text); margin:0;}
  .eyebrow{font-size:10.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent-deep); margin-bottom:6px;}
  .muted{color:var(--text-muted); font-size:12.5px;}
  .muted-light{color:var(--text-muted); font-size:12.5px;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .row-between{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}

  .target-box{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .target-box input{width:64px; font-family:var(--mono); font-size:14px; padding:6px 8px; border:1px solid var(--border); border-radius:7px; background:#fff;}
  .progress-track{height:7px; background:var(--surface-alt); border-radius:4px; overflow:hidden; margin-top:10px;}
  .progress-fill{height:100%; background:var(--accent);}

  button.primary{background:var(--accent); color:#fff; border:none; font-size:12.5px; font-weight:700; padding:10px 18px; border-radius:9px; cursor:pointer;}
  button.primary:hover{background:var(--accent-deep);}
  button.ghost{background:#fff; border:1px solid var(--border); color:var(--text); font-size:12px; font-weight:600; padding:7px 13px; border-radius:9px; cursor:pointer;}
  button.ghost:hover{border-color:var(--accent); color:var(--accent-deep);}
  button.small-link{background:none; border:none; color:var(--accent-deep); font-size:12px; font-weight:600; cursor:pointer; padding:0;}
  button.danger-link{background:none; border:none; color:var(--warn); font-size:12px; font-weight:600; cursor:pointer; padding:0;}

  .period-toggle{display:inline-flex; background:var(--surface-alt); border-radius:8px; padding:3px; gap:2px;}
  .period-toggle button{border:none; background:none; padding:6px 13px; border-radius:6px; font-size:11.5px; font-weight:700; color:var(--text-muted); cursor:pointer;}
  .period-toggle button.active{background:#fff; color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,0.08);}

  .metric-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-top:12px;}
  .metric-tile{background:var(--surface-alt); border:1px solid var(--border); border-radius:10px; padding:12px 13px;}
  @keyframes redPulse { 0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0.45);} 50%{box-shadow:0 0 0 5px rgba(220,38,38,0);} }
  .notif-badge{position:absolute; top:-8px; right:-8px; background:var(--warn); color:#fff; font-size:12px; font-weight:800; min-width:23px; height:23px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 6px; border:2px solid var(--surface-alt); animation: redPulse 2.2s ease-in-out infinite; cursor:pointer; z-index:5;}
  .badge-tooltip{position:absolute; top:30px; left:50%; transform:translateX(-50%); width:230px; max-width:85vw; z-index:20; background:var(--text); color:#fff; font-size:12px; font-weight:500; line-height:1.45; padding:10px 12px; border-radius:9px; opacity:0; pointer-events:none; transition:opacity 0.15s ease; box-shadow:0 8px 22px rgba(0,0,0,0.3);}
  .metric-tile:hover .badge-tooltip, .badge-tooltip.show{opacity:1; pointer-events:auto;}
  .metric-value{font-family:var(--mono); font-size:23px; font-weight:700; color:var(--text); line-height:1;}
  .metric-label{font-size:10.5px; color:var(--text-muted); margin-top:5px; line-height:1.3;}

  .contact-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:19px 21px; margin-bottom:14px;}
  .contact-card.nested{background:var(--surface-alt); border-color:transparent;}
  .status-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--good); margin-right:7px; flex-shrink:0;}
  .status-dot.overdue{background:var(--warn);}
  .contact-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:5px;}
  .contact-name{font-size:15px; font-weight:800; letter-spacing:-0.01em; display:flex; align-items:center; color:var(--text);}
  .contact-meta{font-size:11.5px; color:var(--text-muted); margin-top:5px; margin-left:14px;}
  .contact-meta.overdue-text{color:var(--warn); font-weight:600;}

  .trail{display:flex; align-items:center; margin:12px 0 6px;}
  .trail .seg{flex:1; height:2px; background:var(--border);}
  .trail .seg.filled{background:var(--accent);}
  .trail .node{width:9px; height:9px; border-radius:50%; background:#fff; border:2px solid var(--border); flex-shrink:0;}
  .trail .node.filled{background:var(--accent); border-color:var(--accent-deep);}
  .trail-caption{font-size:11px; color:var(--text-muted); margin-bottom:8px;}
  .trail-caption b{color:var(--text);}

  .notes-text{font-size:13px; color:var(--text); opacity:0.85; margin:7px 0 9px; line-height:1.5;}
  .contact-actions{display:flex; gap:8px 18px; margin-top:14px; flex-wrap:wrap;}

  .field{margin-bottom:11px;}
  .field label{display:block; font-size:10.5px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px;}
  .field input, .field textarea, .field select{width:100%; font-family:var(--sans); font-size:14px; padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text);}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .field textarea{min-height:60px; resize:vertical;}
  .form-actions{display:flex; gap:8px; margin-top:6px;}
  .empty-state{text-align:center; padding:28px 14px; color:var(--text-muted); font-size:13.5px;}

  .funnel-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .funnel-label{width:130px; font-size:11px; color:var(--text-muted); flex-shrink:0;}
  .funnel-track{flex:1; height:12px; background:var(--surface-alt); border-radius:6px; overflow:hidden;}
  .funnel-fill{height:100%; background:var(--accent);}
  .funnel-count{width:28px; text-align:right; font-family:var(--mono); font-size:11.5px; flex-shrink:0;}

  .missionary-block{padding:14px 0; border-bottom:1px solid var(--border);}
  .missionary-block:last-child{border-bottom:none;}
  .missionary-block .name{font-size:15px; font-weight:800; letter-spacing:-0.01em;}
  .flag-badge{background:var(--warn-soft); color:var(--warn); font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:6px; white-space:nowrap;}
  .ok-badge{background:var(--good-soft); color:var(--good); font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:6px; white-space:nowrap;}

  .daeen-region{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--accent-deep); margin:4px 0 2px 14px; display:block;}
  .expand-toggle{margin-top:12px;}
  .nested-block{margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}

  .search-box input{width:100%; font-family:var(--sans); font-size:14px; padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text); margin-bottom:10px;}

  .setup-screen{max-width:440px; margin:56px auto;}
  .setup-screen h1{font-size:30px; font-weight:800; color:var(--text); margin-bottom:4px; text-align:center;}
  .setup-screen .sub{font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent-deep); margin-bottom:28px; text-align:center;}
  .setup-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px; text-align:left; box-shadow:0 1px 2px rgba(0,0,0,0.03), 0 10px 30px rgba(16,24,32,0.06);}
  .role-choice{display:flex; gap:10px; flex-wrap:wrap;}
  .role-choice button{flex:1; min-width:130px; padding:20px 12px; background:#fff; border:1px solid var(--border); border-radius:12px; cursor:pointer; text-align:center;}
  .role-choice button:hover{border-color:var(--accent);}
  .role-choice .r-title{font-size:15.5px; font-weight:800; color:var(--text);}
  .role-choice .r-sub{font-size:10.5px; color:var(--text-muted); text-transform:uppercase; margin-top:4px; font-weight:600;}
  .existing-list{margin:10px 0 16px; display:flex; flex-wrap:wrap; gap:6px; max-height:220px; overflow-y:auto;}
  .existing-list button{background:var(--surface-alt); border:1px solid var(--border); color:var(--text); font-family:var(--sans); font-size:13px; padding:6px 12px; border-radius:8px; cursor:pointer; text-align:left;}
  .existing-list button:hover{border-color:var(--accent); color:var(--accent-deep);}
  .existing-list button .sub{display:block; font-size:9.5px; color:var(--text-muted); text-transform:uppercase; margin-top:1px;}
  .divider-or{text-align:center; font-size:10.5px; font-weight:600; text-transform:uppercase; color:var(--text-muted); margin:14px 0;}
  .loading{text-align:center; color:var(--text-muted); font-size:12.5px; padding:50px 0;}
  .summary-box{background:var(--text); color:#fff; font-family:var(--mono); font-size:11.5px; line-height:1.7; padding:14px; border-radius:10px; white-space:pre-wrap; margin-top:10px; max-height:320px; overflow-y:auto;}
  .error-text{color:var(--warn); font-size:12px; margin-top:8px;}
  .back-link{margin-bottom:10px;}
  .info-banner{background:var(--surface-alt); border-radius:10px; padding:13px 15px; margin-bottom:14px; font-size:13px; color:var(--text); line-height:1.6;}
  .info-banner b{font-weight:700;}

  table.admin-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.admin-table th{text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; color:var(--text-muted); padding:8px 7px; border-bottom:1px solid var(--border);}
  table.admin-table td{padding:8px 7px; border-bottom:1px solid var(--border); vertical-align:middle;}
  table.admin-table select{font-size:12px; padding:5px 6px; border-radius:6px; border:1px solid var(--border);}
  .import-instructions{font-size:12px; color:var(--text-muted); line-height:1.6; margin-bottom:10px;}
  .import-instructions code{background:var(--surface-alt); padding:1px 5px; border-radius:5px;}
  textarea.bulk-import{width:100%; min-height:150px; font-family:var(--mono); font-size:12px; padding:11px; border:1px solid var(--border); border-radius:8px;}
  .preview-row{font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--border);}

  /* ---------- motion & depth ---------- */
  @keyframes fadeInUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes softPulse { 0%,100%{box-shadow:0 0 0 0 rgba(13,148,136,0.35);} 50%{box-shadow:0 0 0 7px rgba(13,148,136,0);} }
  @keyframes toastIn { from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }

  .card{ animation: fadeInUp 0.4s cubic-bezier(0.22,1,0.36,1) both; }
  .contact-card{ animation: fadeInUp 0.35s cubic-bezier(0.22,1,0.36,1) both; transition: box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s ease; }
  .contact-card:hover{ box-shadow:0 4px 14px rgba(0,0,0,0.06); }
  .missionary-block{ animation: fadeInUp 0.35s cubic-bezier(0.22,1,0.36,1) both; }

  button.primary{
    box-shadow:0 2px 10px rgba(13,148,136,0.28);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  }
  button.primary:hover{ box-shadow:0 4px 16px rgba(13,148,136,0.36); transform:translateY(-1px); }
  button.primary:active{ transform:scale(0.97); box-shadow:0 1px 4px rgba(13,148,136,0.3); }
  button.ghost, button.small-link, button.danger-link{ transition: color 0.15s ease, border-color 0.15s ease, transform 0.12s ease; }
  button.ghost:active{ transform:scale(0.97); }

  .progress-fill{ transition: width 0.9s cubic-bezier(0.22,1,0.36,1); }
  .status-dot{ transition: background 0.3s ease, box-shadow 0.3s ease; }
  .status-dot:not(.overdue){ box-shadow:0 0 0 4px rgba(22,163,74,0.14); }
  .status-dot.overdue{ animation: softPulse 2.2s ease-in-out infinite; }

  nav.tabs button{ transition: color 0.2s ease, border-color 0.25s cubic-bezier(0.22,1,0.36,1); }
  nav.tabs button.active{ animation: fadeInUp 0.2s ease both; }

  .empty-state{ animation: fadeInUp 0.4s ease both; }
  .cta-pulse{ animation: softPulse 2.4s ease-in-out infinite; }

  .sos-toast{
    position:fixed; bottom:24px; left:50%; z-index:9999;
    background:var(--text); color:#fff; padding:11px 20px; border-radius:999px;
    font-size:13px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,0.25);
    animation: toastIn 0.3s cubic-bezier(0.22,1,0.36,1) both; pointer-events:none;
    max-width:88vw; text-align:center;
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
  const root = document.getElementById('root');
  let state = {
    loading: true,
    me: null,               // {role:'missionary'|'admin', id, name}
    admins: [],
    missionaries: [],        // [{id,name,target,groups,isRegionalLeader,regionalLeaderId}]
    daeenRoster: [],         // [{id,name,region,missionaryId,notes,lastEngaged}]
    contactsM: {},           // {missionaryId: [contact,...]}
    contactsD: {},           // {daeenId: [contact,...]}
    groupReports: {},        // {missionaryId: [{id,date,group,notes}]}
    stageLabels: ['Initial Contact','Interested','Ta\'leem (Study)','Bai\'at'],
    tab: 'mine',
    period: 'week',
    setupStage: 'role',
    pendingRole: null,
    passwordInput: '',
    searchText: '',
    daeenFilterUnassigned: false,
    daeenFilterNotContacted: false,
    contactsFilterNotEngaged: false,
    contactsFilterStage: '',
    baiatFilterRegion: '',
    baiatFilterMissionary: '',
    baiatFilterAuxiliary: '',
    baiatFilterGender: '',
    baiatFilterMonth: '',
    newName: '',
    newRegion: '',
    newGroups: [],
    addingContact: false,
    editingContactId: null,
    expandedHistoryId: null,
    expandedBaiatId: null,
    transferringContactId: null,
    addingDaeen: false,
    editingDaeenId: null,
    expandedDaeenId: null,
    addingDaeenContact: false,
    editingDaeenContactId: null,
    editingGroups: false,
    addingGroupReport: false,
    bulkImportText: '',
    bulkImportPreview: null,
    bulkMissionaryText: '',
    bulkMissionaryPreview: null,
    newPasswordInput: '',
    newPasswordConfirm: '',
    selectedAdminId: '',
    selectedMissionaryId: '',
    addingAdminMember: false,
    error: ''
  };

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function daysAgo(iso){
    if(!iso) return null;
    const then = new Date(iso + 'T00:00:00');
    const now = new Date();
    return Math.floor((now - then) / (1000*60*60*24));
  }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function showToast(msg){
    let toast = document.getElementById('sos-toast');
    if(toast) toast.remove();
    toast = document.createElement('div');
    toast.id = 'sos-toast';
    toast.className = 'sos-toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(()=>{ toast.remove(); }, 1800);
  }
  function escapeHtml(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function periodStartISO(period){
    if(period==='month'){
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
    }
    // Reporting week runs Wednesday through the following Tuesday — this way,
    // when the Tuesday meeting happens, "this week" is the full week that just
    // finished (including that Tuesday), not a brand-new empty one.
    // (Day-level precision only — the app stores dates, not exact times.)
    const now = new Date();
    const day = now.getDay(); // 0=Sun..6=Sat, Wednesday=3
    const daysSinceWednesday = (day - 3 + 7) % 7;
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceWednesday);
    return start.toISOString().slice(0,10);
  }
  function inCurrentMonth(dateStr){
    if(!dateStr) return false;
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
    const end = new Date(now.getFullYear(), now.getMonth()+1, 0).toISOString().slice(0,10);
    return dateStr >= start && dateStr <= end;
  }

  // ---------- storage adapter: Google Apps Script (shared) + localStorage (personal "who am I") ----------

  const API_URL = 'https://script.google.com/macros/s/AKfycbyUS7Q5K4qTJu0Q82rM9gXw9DzGfqbOSWVAPbrZODFjjEu9OzE7a-ZSyKYoiP0Itc4m/exec';

  async function gsGetAll(){
    try{
      const res = await fetch(API_URL + '?action=getAll', { method: 'GET' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }catch(err){
      console.error(err);
      state.error = 'Could not reach the spreadsheet. Check your connection and reload.';
      render();
      return {};
    }
  }
  async function gsSet(key, value){
    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'set', key, value})
      });
      const data = await res.json();
      return !!data.success;
    }catch(err){
      console.error(err);
      state.error = 'Could not save — try again.';
      render();
      return false;
    }
  }
  async function gsGetFresh(key){
    try{
      const res = await fetch(API_URL + '?action=getKey&key=' + encodeURIComponent(key));
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      return data.value;
    }catch(err){
      console.error(err);
      return null;
    }
  }

  // Missionaries and the Daeen roster are SHARED lists many people can edit
  // at once. If two people have the app open, each holds a snapshot from
  // whenever they loaded the page. Saving that snapshot directly would
  // silently erase anything anyone else changed in the meantime — which is
  // exactly what caused missionaries and assignments to vanish before.
  // These two functions always re-fetch the LATEST version from the server
  // first, apply the change to that, and only then save — so nobody's
  // change ever gets clobbered by someone else's stale local copy.
  async function mutateSharedMissionaries(mutatorFn){
    const raw = await gsGetFresh('missionaries');
    let fresh = state.missionaries;
    if(raw){ try{ fresh = JSON.parse(raw); }catch(e){} }
    mutatorFn(fresh);
    state.missionaries = fresh;
    await gsSet('missionaries', JSON.stringify(fresh));
    render();
  }
  async function mutateSharedDaeenRoster(mutatorFn){
    const raw = await gsGetFresh('daeen-roster');
    let fresh = state.daeenRoster;
    if(raw){ try{ fresh = JSON.parse(raw); }catch(e){} }
    mutatorFn(fresh);
    state.daeenRoster = fresh;
    await gsSet('daeen-roster', JSON.stringify(fresh));
    render();
  }

  function localGetMe(){
    try{ const raw = localStorage.getItem('sos-me'); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }
  function localSetMe(m){

  function weekBuckets(dates, weeks){
    const now = new Date();
    const buckets = new Array(weeks).fill(0);
    for(const dstr of (dates||[])){
      if(!dstr) continue;
      const d = new Date(dstr + 'T00:00:00');
      const diffDays = Math.floor((now - d) / (1000*60*60*24));
      const weekIndex = Math.floor(diffDays/7);
      if(weekIndex>=0 && weekIndex<weeks) buckets[weeks-1-weekIndex]++;
    }
    return buckets;
  }
  function monthBuckets(dates, months){
    const now = new Date();
    const buckets = new Array(months).fill(0);
    for(const dstr of (dates||[])){
      if(!dstr) continue;
      const d = new Date(dstr + 'T00:00:00');
      const diffMonths = (now.getFullYear()-d.getFullYear())*12 + (now.getMonth()-d.getMonth());
      if(diffMonths>=0 && diffMonths<months) buckets[months-1-diffMonths]++;
    }
    return buckets;
  }
  function streakFromBuckets(buckets){
    let streak = 0;
    for(let i=buckets.length-1;i>=0;i--){ if(buckets[i]>0) streak++; else break; }
    return streak;
  }
  function previousWeekRangeISO(){
    const thisStart = periodStartISO('week');
    const start = new Date(thisStart + 'T00:00:00');
    start.setDate(start.getDate()-7);
    return {start: start.toISOString().slice(0,10), end: thisStart};
  }
  function previousMonthRangeISO(){
    const thisStart = periodStartISO('month');
    const thisStartDate = new Date(thisStart + 'T00:00:00');
    const prevStart = new Date(thisStartDate.getFullYear(), thisStartDate.getMonth()-1, 1);
    return {start: prevStart.toISOString().slice(0,10), end: thisStart};
  }
  // A compact "is this better or worse than last week" indicator — an arrow,
  // a color, and the plain numbers. Deliberately not a chart: the point is
  // a one-glance read, not a data dive.
  function weekTrendRow(label, thisWeekVal, lastWeekVal){
    const diff = thisWeekVal - lastWeekVal;
    let arrow, color, text;
    if(diff > 0){ arrow = '\u2191'; color = 'var(--good)'; text = 'up ' + diff + ' from last week'; }
    else if(diff < 0){ arrow = '\u2193'; color = 'var(--warn)'; text = 'down ' + Math.abs(diff) + ' from last week'; }
    else { arrow = '\u2192'; color = 'var(--text-muted)'; text = 'same as last week'; }
    return '<div class="row-between" style="padding:9px 0; border-bottom:1px solid var(--border);">'
      + '<div>' + escapeHtml(label) + '</div>'
      + '<div style="text-align:right;"><span style="font-family:var(--mono); font-weight:700;">' + thisWeekVal + '</span> '
      + '<span style="color:' + color + '; font-weight:700;">' + arrow + '</span> '
      + '<span class="muted" style="font-size:11px;">' + text + ' (was ' + lastWeekVal + ')</span></div>'
      + '</div>';
  }
  function svgBarChart(buckets, color){
    const w = 100, h = 60, gap = 1.2;
    const barW = (w/buckets.length) - gap;
    const maxV = Math.max(1, ...buckets);
    let bars = '';
    buckets.forEach((v,i)=>{
      const bh = v>0 ? Math.max(3, (v/maxV)*38) : 1;
      const x = i*(barW+gap);
      const y = 48 - bh;
      bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="1.5" fill="' + (color||'var(--accent)') + '"></rect>';
      bars += '<text x="' + (x+barW/2).toFixed(1) + '" y="58" font-size="4.5" text-anchor="middle" fill="#8a93a3">' + v + '</text>';
    });
    return '<svg viewBox="0 0 ' + w + ' 62" style="width:100%; height:60px;">' + bars + '</svg>';
  }

  function computeAuxiliary(age, gender){
    const a = parseInt(age);
    if(!a || !gender) return '';
    if(gender==='Male'){
      if(a>=7 && a<=14) return 'Atfal';
      if(a>=15 && a<=40) return 'Khuddam';
      if(a>40) return 'Ansar';
    } else if(gender==='Female'){
      if(a>=7 && a<=14) return 'Nasirat';
      if(a>=15) return 'Lajna';
    }
    return '';
  }

  // Same shape as computeMetrics, but takes an explicit period-start date
  // instead of reading the global week/month toggle — used by the parameterized
  // Weekly/Monthly National Report so each report is always internally
  // consistent regardless of what the funnel toggle happens to be set to.
  function computeMetricsForPeriod(missionaryId, periodStart){
    const daeenList = state.daeenRoster.filter(d=>d.missionaryId===missionaryId);
    const daeenReachedOut = daeenList.filter(d=> d.lastEngaged && d.lastEngaged >= periodStart).length;
    const personalContacts = state.contactsM[missionaryId] || [];
    const personalReachedOut = personalContacts.filter(c=> (c.lastContact && c.lastContact>=periodStart) || (c.history||[]).some(h=>h>=periodStart)).length;
    let baiats = 0;
    for(const c of personalContacts){ if(c.stage===3 && c.baiatDate && c.baiatDate>=periodStart) baiats++; }
    let tablighTotal = 0, tablighReachedOut = 0;
    for(const d of daeenList){
      const cs = state.contactsD[d.id] || [];
      tablighTotal += cs.length;
      for(const c of cs){
        if(c.lastContact && c.lastContact >= periodStart) tablighReachedOut++;
        if(c.stage===3 && c.baiatDate && c.baiatDate>=periodStart) baiats++;
      }
    }
    return {
      daeenReachedOut, daeenTotal: daeenList.length,
      personalContactsTotal: personalContacts.length, personalReachedOut,
      baiats, tablighReachedOut, tablighTotal
    };
  }
  function computeMetrics(missionaryId){
    const periodStart = periodStartISO(state.period);
    const daeenList = state.daeenRoster.filter(d=>d.missionaryId===missionaryId);
    const daeenReachedOut = daeenList.filter(d=> d.lastEngaged && d.lastEngaged >= periodStart).length;
    const personalContacts = state.contactsM[missionaryId] || [];
    const personalReachedOut = personalContacts.filter(c=> (c.lastContact && c.lastContact>=periodStart) || (c.history||[]).some(h=>h>=periodStart)).length;
    let baiats = 0;
    for(const c of personalContacts){ if(c.stage===3 && inCurrentMonth(c.baiatDate)) baiats++; }
    let tablighTotal = 0, tablighReachedOut = 0;
    for(const d of daeenList){
      const cs = state.contactsD[d.id] || [];
      tablighTotal += cs.length;
      for(const c of cs){
        if(c.lastContact && c.lastContact >= periodStart) tablighReachedOut++;
        if(c.stage===3 && inCurrentMonth(c.baiatDate)) baiats++;
      }
    }
    return {
      daeenReachedOut, daeenTotal: daeenList.length,
      personalContactsTotal: personalContacts.length, personalReachedOut,
      baiats, tablighReachedOut, tablighTotal
    };
  }

  const DAEEN_ANNUAL_GOAL = 1;

  function inCurrentYear(dateStr){
    if(!dateStr) return false;
    return dateStr.slice(0,4) === String(new Date().getFullYear());
  }

  function baiatsYTDForMissionary(missionaryId){
    let count = 0;
    for(const c of (state.contactsM[missionaryId]||[])){ if(c.stage===3 && inCurrentYear(c.baiatDate)) count++; }
    const daeenList = state.daeenRoster.filter(d=>d.missionaryId===missionaryId);
    for(const d of daeenList){
      for(const c of (state.contactsD[d.id]||[])){ if(c.stage===3 && inCurrentYear(c.baiatDate)) count++; }
    }
    return count;
  }

  function daeenMetAnnualGoal(daeenId){
    return (state.contactsD[daeenId]||[]).filter(c=>c.stage===3 && inCurrentYear(c.baiatDate)).length >= DAEEN_ANNUAL_GOAL;
  }

  function allContactsUnderMissionary(missionaryId){
    let all = (state.contactsM[missionaryId]||[]).slice();
    const myDaeen = state.daeenRoster.filter(d=>d.missionaryId===missionaryId);
    myDaeen.forEach(d=>{ all = all.concat(state.contactsD[d.id]||[]); });
    return all;
  }

  function conversionRateForMissionary(missionaryId){
    const all = allContactsUnderMissionary(missionaryId);
    if(!all.length) return 0;
    return Math.round(all.filter(c=>c.stage===3).length / all.length * 100);
  }

  function daysBetween(d1, d2){
    return Math.round((new Date(d2+'T00:00:00') - new Date(d1+'T00:00:00')) / (1000*60*60*24));
  }

  // Average days from first-logged contact to reaching Bai'at, across a set of contacts.
  function avgTimeToConversion(contactsList){
    const converted = (contactsList||[]).filter(c=>c.stage===3 && c.baiatDate && (c.created || (c.history&&c.history.length)));
    if(!converted.length) return null;
    const days = converted.map(c=>{
      const start = c.created || c.history[0];
      return daysBetween(start, c.baiatDate);
    }).filter(d=>d>=0);
    if(!days.length) return null;
    return Math.round(days.reduce((a,b)=>a+b,0) / days.length);
  }

  // Compares conversion rate for contacts whose most recent logged method was
  // in-person vs. phone. Approximate — reflects the latest method logged, not
  // a full history of every method used with that contact.
  function methodEffectiveness(contactsList){
    const withMethod = (contactsList||[]).filter(c=>c.method==='in_person' || c.method==='phone');
    const inPerson = withMethod.filter(c=>c.method==='in_person');
    const phone = withMethod.filter(c=>c.method==='phone');
    const rate = arr => arr.length ? Math.round(arr.filter(c=>c.stage===3).length/arr.length*100) : null;
    return {
      inPerson: {count: inPerson.length, rate: rate(inPerson)},
      phone: {count: phone.length, rate: rate(phone)}
    };
  }

  function computeBadges(missionaryId){
    const badges = [];
    const all = allContactsUnderMissionary(missionaryId);
    if(all.some(c=>c.stage===3)) badges.push('First Bai\u2019at');
    if(all.length>=10) badges.push('10 contacts reached');
    const hist = collectHistory(state.contactsM[missionaryId]||[]);
    const streak = streakFromBuckets(weekBuckets(hist,8));
    if(streak>=4) badges.push('Consistent weekly effort');
    const myDaeen = state.daeenRoster.filter(d=>d.missionaryId===missionaryId);
    if(myDaeen.length>0 && myDaeen.every(d=>isDaeenActive(d.id))) badges.push('All Daeen active');
    return badges;
  }

  const STAGNANT_DAYS = 14;
  function stagnantContacts(list){
    return (list||[]).filter(c=>{
      const d = daysAgo(c.lastContact);
      return d !== null && d >= STAGNANT_DAYS;
    });
  }
  function upcomingFollowUps(list){
    return (list||[]).filter(c=>c.nextFollowUp).sort((a,b)=> a.nextFollowUp.localeCompare(b.nextFollowUp));
  }

  const DAEEN_ACTIVE_WINDOW_DAYS = 30;
  function isDaeenActive(daeenId){
    const d = state.daeenRoster.find(x=>x.id===daeenId);
    if(!d) return false;
    const dd = daysAgo(d.lastEngaged);
    if(dd !== null && dd <= DAEEN_ACTIVE_WINDOW_DAYS) return true;
    const cs = state.contactsD[daeenId] || [];
    return cs.some(c => (c.history||[]).some(h=>{
      const hd = daysAgo(h);
      return hd !== null && hd <= DAEEN_ACTIVE_WINDOW_DAYS;
    }));
  }
  function isContactActive(c){
    const dd = daysAgo(c.lastContact);
    if(dd !== null && dd <= DAEEN_ACTIVE_WINDOW_DAYS) return true;
    return (c.history||[]).some(h=>{
      const hd = daysAgo(h);
      return hd !== null && hd <= DAEEN_ACTIVE_WINDOW_DAYS;
    });
  }

  }

  function progressBarHtml(current, goal, label){
    const pct = goal>0 ? Math.min(100, Math.round(current/goal*100)) : 0;
    let html = '<div style="margin-bottom:10px;">';
    html += '<div class="row-between" style="margin-bottom:4px;"><span class="muted">' + escapeHtml(label) + '</span><span class="muted" style="font-family:var(--mono);">' + current + ' / ' + goal + '</span></div>';

  function chooseRole(role){
    state.pendingRole = role;
    if(role === 'admin'){
      state.setupStage = state.admins.length ? 'pick' : 'password';
    } else {
      state.setupStage = 'pick';
    }
    state.passwordInput = '';
    state.newPasswordInput = '';
    state.newPasswordConfirm = '';
    state.selectedAdminId = '';
    state.selectedMissionaryId = '';
    state.searchText = '';
    state.newName = '';
    state.newRegion = '';
    state.newGroups = [];
    state.error = '';
    render();
  }
  function checkAdminPassword(){
    if(state.passwordInput === '1889'){ state.setupStage = 'adminCreate'; state.error = ''; }
    else{ state.error = 'Incorrect password.'; }
    render();
  }
  function selectAdminForLogin(a){
    state.selectedAdminId = a.id;
    state.setupStage = 'adminPassword';
    state.passwordInput = '';
    state.error = '';
    render();
  }
  async function submitAdminPasswordLogin(){
    const a = state.admins.find(x=>x.id===state.selectedAdminId);
    if(!a){ state.error = 'Something went wrong — go back and try again.'; render(); return; }
    if(!a.password){
      // First login for an account created before passwords existed — set one now.
      if(!state.passwordInput || state.passwordInput.length < 4){ state.error = 'Choose a password at least 4 characters long.'; render(); return; }
      if(state.passwordInput !== state.newPasswordConfirm){ state.error = 'Passwords don\u2019t match.'; render(); return; }
      a.password = state.passwordInput;
      await saveAdmins();
      await chooseExistingAdmin(a);
      return;
    }
    if(state.passwordInput === a.password){
      await chooseExistingAdmin(a);
    } else {
      state.error = 'Incorrect password.';
      render();
    }
  }
  async function submitAdminCreate(){
    const name = state.newName.trim();
    if(!name){ state.error = 'Enter a name.'; render(); return; }
    if(!state.newPasswordInput || state.newPasswordInput.length < 4){ state.error = 'Choose a password at least 4 characters long.'; render(); return; }
    if(state.newPasswordInput !== state.newPasswordConfirm){ state.error = 'Passwords don\u2019t match.'; render(); return; }
    if(state.admins.find(a=>a.name.toLowerCase()===name.toLowerCase())){ state.error = 'That name is already taken.'; render(); return; }
    const a = {id: uid(), name, password: state.newPasswordInput};
    state.admins.push(a);
    await saveAdmins();
    state.tab = 'report';
    await saveMe({role:'admin', id:a.id, name:a.name});
    render();
  }
  async function confirmAddAdmin(){
    const name = state.newName.trim();
    if(!name){ state.error = 'Enter a name.'; render(); return; }
    if(!state.newPasswordInput || state.newPasswordInput.length < 4){ state.error = 'Choose a password at least 4 characters long.'; render(); return; }
    if(state.admins.find(a=>a.name.toLowerCase()===name.toLowerCase())){ state.error = 'That name is already taken.'; render(); return; }
    state.admins.push({id: uid(), name, password: state.newPasswordInput});
    await saveAdmins();
    state.addingAdminMember = false;
    state.newName = ''; state.newPasswordInput = ''; state.error = '';
    render();
  }

  function selectMissionaryForLogin(m){
    state.selectedMissionaryId = m.id;
    state.setupStage = 'missionaryPassword';
    state.passwordInput = '';
    state.newPasswordConfirm = '';
    state.error = '';
    render();
  }
  async function submitMissionaryPasswordLogin(){
    const m = state.missionaries.find(x=>x.id===state.selectedMissionaryId);
    if(!m){ state.error = 'Something went wrong — go back and try again.'; render(); return; }
    if(!m.password){
      if(!state.passwordInput || state.passwordInput.length < 4){ state.error = 'Choose a password at least 4 characters long.'; render(); return; }
      if(state.passwordInput !== state.newPasswordConfirm){ state.error = 'Passwords don\u2019t match.'; render(); return; }
      const chosenPassword = state.passwordInput;
      await mutateSharedMissionaries(fresh=>{
        const fm = fresh.find(x=>x.id===m.id);
        if(fm) fm.password = chosenPassword;
      });
      await chooseExistingMissionary(m);
      return;
    }
    if(state.passwordInput === m.password){
      await chooseExistingMissionary(m);
    } else {
      state.error = 'Incorrect password.';
      render();
    }
  }

    else state.tab = 'mine';

  function attachSetupHandlers(){
    const rm = document.getElementById('roleMissionary');
    if(rm) rm.addEventListener('click', ()=>chooseRole('missionary'));
    const rgl = document.getElementById('roleGroupLeader');
    if(rgl) rgl.addEventListener('click', ()=>chooseRole('groupleader'));
    const ra = document.getElementById('roleAdmin');
    if(ra) ra.addEventListener('click', ()=>chooseRole('admin'));
    const back = document.getElementById('backToRole');
    if(back) back.addEventListener('click', ()=>{ state.setupStage='role'; state.error=''; render(); });

    root.querySelectorAll('.existing-list button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const kind = btn.getAttribute('data-kind');
        const id = btn.getAttribute('data-id');
        if(kind==='m'){ const m = state.missionaries.find(x=>x.id===id); if(m) selectMissionaryForLogin(m); }
        else if(kind==='a2'){ const a = state.admins.find(x=>x.id===id); if(a) selectAdminForLogin(a); }
      });
    });
    const missionarySearchInput = document.getElementById('missionarySearchInput');
    if(missionarySearchInput) missionarySearchInput.addEventListener('input', e=>{ state.searchText = e.target.value; render(); });
    const passwordInput = document.getElementById('passwordInput');
    if(passwordInput){
      passwordInput.addEventListener('input', e=>{ state.passwordInput = e.target.value; });
      passwordInput.addEventListener('keydown', e=>{
        if(e.key==='Enter'){
          if(state.setupStage==='adminPassword') submitAdminPasswordLogin();
          else if(state.setupStage==='missionaryPassword') submitMissionaryPasswordLogin();
          else checkAdminPassword();
        }
      });
    }
    const newPasswordInput = document.getElementById('newPasswordInput');
    if(newPasswordInput) newPasswordInput.addEventListener('input', e=>{ state.newPasswordInput = e.target.value; });
    const newPasswordConfirm = document.getElementById('newPasswordConfirm');
    if(newPasswordConfirm) newPasswordConfirm.addEventListener('input', e=>{ state.newPasswordConfirm = e.target.value; });
    const submitPasswordBtn = document.getElementById('submitPasswordBtn');
    if(submitPasswordBtn) submitPasswordBtn.addEventListener('click', checkAdminPassword);
    const submitAdminCreateBtn = document.getElementById('submitAdminCreateBtn');
    if(submitAdminCreateBtn) submitAdminCreateBtn.addEventListener('click', submitAdminCreate);
    const submitAdminPasswordBtn = document.getElementById('submitAdminPasswordBtn');
    if(submitAdminPasswordBtn) submitAdminPasswordBtn.addEventListener('click', submitAdminPasswordLogin);
    const submitMissionaryPasswordBtn = document.getElementById('submitMissionaryPasswordBtn');
    if(submitMissionaryPasswordBtn) submitMissionaryPasswordBtn.addEventListener('click', submitMissionaryPasswordLogin);
  }

    if(c.nextFollowUp){
      const fOverdue = c.nextFollowUp < todayStr();
      html += '<div class="contact-meta" style="' + (fOverdue?'color:var(--warn); font-weight:600;':'') + '">Next follow-up: ' + escapeHtml(c.nextFollowUp) + (fOverdue?' (overdue)':'') + '</div>';

    html += '</div>';
    html += '<div class="row-between" style="align-items:center; margin-bottom:6px; gap:10px;">';
    html += '<div class="trail-caption" style="margin-bottom:0;">Currently: <b>' + escapeHtml(state.stageLabels[c.stage]) + '</b></div>';
    if(opts.editable && c.stage < 3){
      html += '<button class="primary" data-action="advance" data-id="' + c.id + '" style="padding:6px 14px; font-size:11.5px; white-space:nowrap;">Advance to ' + escapeHtml(state.stageLabels[c.stage+1]) + ' \u2192</button>';
    }
    html += '</div>';
    html += buildTrail(c.stage);
    if(c.notes) html += '<div class="notes-text">' + escapeHtml(c.notes) + '</div>';
    if(c.source) html += '<div class="muted" style="font-size:11.5px; margin-bottom:6px;">Met via: ' + escapeHtml(c.source) + '</div>';

      }
    }
    if(opts.editable){
      html += '<div class="eyebrow" style="margin-top:14px; margin-bottom:7px;">Log an interaction</div>';
      html += '<div class="row" style="margin-bottom:12px;">';

  function stampBaiat(c, lastContact){
    if(c.stage===3 && !c.baiatDate) c.baiatDate = lastContact || todayStr();
  }
  function stampHistory(c, date){
    if(!c.history) c.history = [];
    if(date && c.history[c.history.length-1] !== date) c.history.push(date);
  }

  // ---------- MISSIONARY: My Contacts ----------

  function myContactsList(){
    return (state.contactsM[state.me.id] || []).slice().sort((a,b)=>{
      return ((daysAgo(b.lastContact) ?? -1)) - ((daysAgo(a.lastContact) ?? -1));
    });
  }
  async function updateTarget(val){
    const newTarget = Math.max(0, parseInt(val)||0);
    await mutateSharedMissionaries(fresh=>{
      const m = fresh.find(r => r.id === state.me.id);
      if(m) m.target = newTarget;
    });
  }
  function hasReportedSince(missionaryId, periodStart){
    const personal = state.contactsM[missionaryId] || [];
    if(personal.some(c => (c.history||[]).some(h=>h>=periodStart))) return true;
    const myDaeen = state.daeenRoster.filter(d=>d.missionaryId===missionaryId);
    if(myDaeen.some(d => d.lastEngaged && d.lastEngaged >= periodStart)) return true;
    for(const d of myDaeen){
      const cs = state.contactsD[d.id] || [];
      if(cs.some(c => (c.history||[]).some(h=>h>=periodStart))) return true;
    }
    return false;
  }
  function hasReportedThisWeek(missionaryId){
    if(hasGroupReportThisWeek(missionaryId)) return true;
    return hasReportedSince(missionaryId, periodStartISO('week'));
  }
  function hasReportedThisMonth(missionaryId){
    return hasReportedSince(missionaryId, periodStartISO('month'));
  }

  function hasGroupReportThisWeek(missionaryId){
    const periodStart = periodStartISO('week');
    return (state.groupReports[missionaryId]||[]).some(r => r.date >= periodStart);
  }
  async function addContact(data){
    const list = state.contactsM[state.me.id] || [];
    const c = {id: uid(), name:data.name, notes:data.notes, stage:data.stage, lastContact:data.lastContact||todayStr(), method:data.method||'', baiatAge:data.baiatAge||'', baiatCity:data.baiatCity||'', baiatFormConfirmed:!!data.baiatFormConfirmed, baiatAdditionalInfo:data.baiatAdditionalInfo||'', baiatMetInPerson:data.baiatMetInPerson||'', baiatFaithAtBaiat:data.baiatFaithAtBaiat||'', baiatFaithAtBirth:data.baiatFaithAtBirth||'', baiatGender:data.baiatGender||'', baiatEthnicity:data.baiatEthnicity||'', baiatMotivation:data.baiatMotivation||'', nextFollowUp:data.nextFollowUp||'', source:data.source||'', created:todayStr()};
    stampBaiat(c, c.lastContact); stampHistory(c, c.lastContact);
    list.push(c);
    state.contactsM[state.me.id] = list;
    await saveContactsM(state.me.id);
    state.addingContact = false; render();
    showToast('Contact added');
  }
  async function updateContact(id, patch){
    const list = state.contactsM[state.me.id] || [];
    const c = list.find(x=>x.id===id);
    if(c){ Object.assign(c, patch); stampBaiat(c, c.lastContact); stampHistory(c, c.lastContact); }
    await saveContactsM(state.me.id);
    state.editingContactId = null; render();
  }
  async function deleteContact(id){
    state.contactsM[state.me.id] = (state.contactsM[state.me.id]||[]).filter(c=>c.id!==id);
    await saveContactsM(state.me.id); render();
  }

  async function transferContact(contactId, targetMissionaryId){
    const list = state.contactsM[state.me.id] || [];
    const c = list.find(x=>x.id===contactId);
    if(!c) return;
    state.contactsM[state.me.id] = list.filter(x=>x.id!==contactId);
    if(!state.contactsM[targetMissionaryId]) state.contactsM[targetMissionaryId] = [];
    state.contactsM[targetMissionaryId].push(c);
    await saveContactsM(state.me.id);
    await saveContactsM(targetMissionaryId);
    state.transferringContactId = null;
    render();
  }

  // ---------- MISSIONARY (Regional Leader): My Region ----------

  function regionTeamFor(missionaryId){
    const me = state.missionaries.find(x=>x.id===missionaryId);
    if(!me) return null;
    const leaderId = me.isRegionalLeader ? me.id : me.regionalLeaderId;
    if(!leaderId) return null;
    const rl = state.missionaries.find(x=>x.id===leaderId);
    if(!rl) return null;
    const team = state.missionaries.filter(m=>m.id===rl.id || m.regionalLeaderId===rl.id);
    return {rl, team};
  }

    const leaders = state.missionaries.filter(m=>m.isRegionalLeader);
    if(leaders.length){
      const regionRanked = leaders.map(rl=>{
        const team = state.missionaries.filter(m=>m.id===rl.id || m.regionalLeaderId===rl.id);
        const baiats = team.reduce((s,m)=>s+baiatsYTDForMissionary(m.id),0);
        let activeDaeen=0, daeenTotal=0, personalContacts=0, daeenContacts=0;
        team.forEach(m=>{
          const myDaeen = state.daeenRoster.filter(d=>d.missionaryId===m.id);
          activeDaeen += myDaeen.filter(d=>isDaeenActive(d.id)).length;
          daeenTotal += myDaeen.length;
          personalContacts += (state.contactsM[m.id]||[]).length;
          myDaeen.forEach(d=> daeenContacts += (state.contactsD[d.id]||[]).length);
        });
        return {rl, baiats, size: team.length, activeDaeen, daeenTotal, personalContacts, daeenContacts};
      }).sort((a,b)=> b.baiats - a.baiats || b.activeDaeen - a.activeDaeen || (b.personalContacts+b.daeenContacts) - (a.personalContacts+a.daeenContacts) || (a.rl.regionLabel||'').localeCompare(b.rl.regionLabel||''));
      html += '<div class="card"><h2>Regions</h2>';
      html += '<div class="muted" style="margin-bottom:10px;">Combined totals year to date, by region.</div>';
      regionRanked.forEach((r,i)=>{
        const isMine = mine && r.rl.id===mine.rl.id;
        html += leaderboardRow(i+1, (r.rl.regionLabel||'Unnamed region') + ' (' + r.size + ')', isMine?'your region':'', [
          {value: r.baiats, label: "Bai\u2019ats"},
          {value: r.activeDaeen+'/'+r.daeenTotal, label: 'Daeen'},
          {value: r.personalContacts, label: 'Contacts'},
          {value: r.daeenContacts, label: 'Via Daeen'}
        ]);
      });
      html += '</div>';
    }

    const baiatRows = collectAllBaiats();
    if(baiatRows.length){
      html += '<div class="card"><h2>List of Bai\'ats</h2>';
      html += '<div class="muted" style="margin-bottom:10px;">Every Bai\u2019at across the org — a reminder of what this work is for.</div>';
      baiatRows.forEach((r,i)=>{
        const aux = computeAuxiliary(r.age, r.gender);
        html += leaderboardRow(i+1, r.contactName, '', [
          {value: r.city||'\u2014', label: 'City'},
          {value: r.introducedBy, label: r.via?'Daeen':'Missionary'},
          {value: aux||'\u2014', label: 'Tajneed'}
        ]);
      });
      html += '</div>';
    }
    return html;
  }

    for(const c of personal){
      if(state.editingContactId === c.id){ html += renderContactForm(c, 'save'); continue; }

    }
    for(const d of myDaeenList){

  function renderReport(periodMode){
    const isWeek = periodMode !== 'month';
    const periodStart = isWeek ? periodStartISO('week') : periodStartISO('month');
    const periodWord = isWeek ? 'week' : 'month';
    const periodWordCap = isWeek ? 'Week' : 'Month';
    const reportedFn = isWeek ? hasReportedThisWeek : hasReportedThisMonth;

    const stageTotals = [0,0,0,0];
    let totalContacts=0, totalBaiats=0;
    for(const m of state.missionaries){
      for(const c of (state.contactsM[m.id]||[])){ stageTotals[c.stage]++; totalContacts++; if(c.stage===3 && inCurrentMonth(c.baiatDate)) totalBaiats++; }
    }
    for(const d of state.daeenRoster){
      for(const c of (state.contactsD[d.id]||[])){ stageTotals[c.stage]++; totalContacts++; if(c.stage===3 && inCurrentMonth(c.baiatDate)) totalBaiats++; }
    }
    let allContacts = [];
    for(const m of state.missionaries) allContacts = allContacts.concat(state.contactsM[m.id]||[]);
    for(const d of state.daeenRoster) allContacts = allContacts.concat(state.contactsD[d.id]||[]);

    const reportedCount = state.missionaries.filter(m=>reportedFn(m.id)).length;
    const baiatsThisPeriod = allContacts.filter(c=>c.stage===3 && c.baiatDate && c.baiatDate>=periodStart).length;
    const baiatsYearToDate = allContacts.filter(c=>c.stage===3 && inCurrentYear(c.baiatDate)).length;
    const periodEndDate = new Date(periodStart + 'T00:00:00');
    if(isWeek) periodEndDate.setDate(periodEndDate.getDate()+6);
    else periodEndDate.setMonth(periodEndDate.getMonth()+1, 0);

    const activeContactsCount = allContacts.filter(isContactActive).length;
    const activeDaeenCount = state.daeenRoster.filter(d=>isDaeenActive(d.id)).length;

    let html = '<div class="card"><h2>This ' + periodWord + ' vs. year to date</h2>';
    html += '<div class="muted" style="margin-bottom:10px;">Reporting ' + periodWord + ': ' + periodStart + ' through ' + periodEndDate.toISOString().slice(0,10) + (isWeek?' (resets Wednesdays)':'') + '</div>';
    html += '<div class="metric-grid">';
    html += metricTileColored(reportedCount, state.missionaries.length, 'Missionaries reported this ' + periodWord);
    html += metricTile(baiatsThisPeriod + ' / ' + baiatsYearToDate, "Bai'ats this " + periodWord + " / year to date");
    html += metricTileColored(activeContactsCount, totalContacts, 'Contacts active');
    html += metricTileColored(activeDaeenCount, state.daeenRoster.length, 'Daeen active');
    html += '</div></div>';

    const lastRange = isWeek ? previousWeekRangeISO() : previousMonthRangeISO();
    const baiatsLastPeriod = allContacts.filter(c=>c.stage===3 && c.baiatDate && c.baiatDate>=lastRange.start && c.baiatDate<lastRange.end).length;
    const engagedThisPeriod = allContacts.filter(c=> (c.lastContact && c.lastContact>=periodStart) || (c.history||[]).some(h=>h>=periodStart)).length;
    const engagedLastPeriod = allContacts.filter(c=> (c.history||[]).some(h=>h>=lastRange.start && h<lastRange.end) || (c.lastContact && c.lastContact>=lastRange.start && c.lastContact<lastRange.end)).length;
    const daeenEngagedThisPeriod = state.daeenRoster.filter(d=> (d.lastEngaged && d.lastEngaged>=periodStart) || (state.contactsD[d.id]||[]).some(c=>(c.history||[]).some(h=>h>=periodStart))).length;
    const daeenEngagedLastPeriod = state.daeenRoster.filter(d=> (d.lastEngaged && d.lastEngaged>=lastRange.start && d.lastEngaged<lastRange.end) || (state.contactsD[d.id]||[]).some(c=>(c.history||[]).some(h=>h>=lastRange.start && h<lastRange.end))).length;
    let daeenOwnedContactsWow = [];
    state.daeenRoster.forEach(d=> daeenOwnedContactsWow = daeenOwnedContactsWow.concat(state.contactsD[d.id]||[]));
    const daeenContactsThisPeriod = daeenOwnedContactsWow.filter(c=> (c.lastContact && c.lastContact>=periodStart) || (c.history||[]).some(h=>h>=periodStart)).length;
    const daeenContactsLastPeriod = daeenOwnedContactsWow.filter(c=> (c.history||[]).some(h=>h>=lastRange.start && h<lastRange.end) || (c.lastContact && c.lastContact>=lastRange.start && c.lastContact<lastRange.end)).length;

    html += '<div class="card"><h2>' + periodWordCap + ' over ' + periodWord + '</h2>';
    html += '<div class="muted" style="margin-bottom:6px;">Is the org trending up or down compared to last ' + periodWord + '?</div>';
    html += weekTrendRow("Bai\u2019ats", baiatsThisPeriod, baiatsLastPeriod);
    html += weekTrendRow('Contacts engaged', engagedThisPeriod, engagedLastPeriod);
    html += weekTrendRow('Daeen engaged', daeenEngagedThisPeriod, daeenEngagedLastPeriod);
    html += weekTrendRow('Daeen contacts engaged', daeenContactsThisPeriod, daeenContactsLastPeriod);
    html += '</div>';

    html += '<div class="card"><div class="row-between"><h2>National funnel</h2>' + periodToggleHtml() + '</div>';
    html += '<div class="muted" style="margin:6px 0 12px;">' + state.missionaries.length + ' missionaries &middot; ' + state.daeenRoster.length + ' Daeen &middot; ' + totalContacts + ' total contacts &middot; ' + totalBaiats + " Bai'ats this month</div>";
    const maxVal = Math.max(1, ...stageTotals);
    for(let i=0;i<4;i++){
      const w = Math.round(stageTotals[i]/maxVal*100);
      html += '<div class="funnel-bar-row"><div class="funnel-label">' + escapeHtml(state.stageLabels[i]) + '</div><div class="funnel-track"><div class="funnel-fill" style="width:' + w + '%;"></div></div><div class="funnel-count">' + stageTotals[i] + '</div></div>';
    }
    html += '</div>';

    const reportRegionLeaders = state.missionaries.filter(m=>m.isRegionalLeader);
    html += '<div class="card"><div class="row-between"><h2>By region — with reporting compliance</h2><button class="ghost" id="copySummaryBtn">Copy ' + periodWord + 'ly report</button></div>';
    html += '<div class="muted" style="margin-bottom:12px;">Region totals, who hasn\u2019t reported yet, and each missionary\u2019s numbers.</div>';
    reportRegionLeaders.forEach(rl=>{
      const team = state.missionaries.filter(m=>m.id===rl.id || m.regionalLeaderId===rl.id);
      let dR=0, dT=0, cR=0, cT=0, bM=0, dcR=0, dcT=0;
      team.forEach(m=>{
        const met = computeMetricsForPeriod(m.id, periodStart);
        dR += met.daeenReachedOut; dT += met.daeenTotal;
        cR += met.personalReachedOut; cT += met.personalContactsTotal;
        dcR += met.tablighReachedOut; dcT += met.tablighTotal;
        bM += met.baiats;
      });
      const notReported = team.filter(m=>!reportedFn(m.id));
      html += '<div class="nested-block" style="margin-top:16px; padding-top:16px;">';
      html += '<div class="row-between"><div class="name" style="font-size:16px;">' + escapeHtml(rl.regionLabel||'Unnamed region') + '</div><div class="muted">' + team.length + ' missionaries</div></div>';
      html += '<div class="metric-grid" style="margin-top:8px; margin-bottom:8px;">';
      html += metricTileColored(dR, dT, 'Daeen reached out to');
      html += metricTileColored(cR, cT, 'Personal contacts reached out to');
      html += metricTileColored(dcR, dcT, 'Contacts reached by Daeen');
      html += metricTile(bM, "Bai'ats this " + periodWord);
      html += '</div>';
      if(notReported.length){
        html += '<div class="flag-badge" style="display:block; padding:8px 12px; margin-bottom:10px;">Didn\u2019t report this ' + periodWord + ': ' + notReported.map(m=>escapeHtml(m.name)).join(', ') + '</div>';
      }
      team.slice().sort((a,b)=> (reportedFn(a.id)?1:0) - (reportedFn(b.id)?1:0)).forEach(m=>{
        const met = computeMetricsForPeriod(m.id, periodStart);
        const reported = reportedFn(m.id);
        html += '<div class="row-between" style="padding:7px 10px; margin-bottom:4px; border-radius:7px; ' + (reported?'':'background:var(--warn-soft);') + '">';
        html += '<div style="font-weight:600; font-size:13px;">' + escapeHtml(m.name) + '</div>';
        html += '<div class="muted" style="font-size:11.5px; text-align:right;">Daeen ' + met.daeenReachedOut + '/' + met.daeenTotal + ' &middot; Contacts ' + met.personalReachedOut + '/' + met.personalContactsTotal + ' &middot; Via Daeen ' + met.tablighReachedOut + '/' + met.tablighTotal + ' &middot; ' + met.baiats + " Bai'ats" + (reported?'':' <b style="color:var(--warn);">— not reported</b>') + '</div>';
        html += '</div>';
      });
      html += '</div>';
    });
    html += '</div>';

    html += renderGoalsAndGroups();

    html += '<div class="card" id="summaryCard" style="display:none;"><h2>Report text</h2><div class="muted">Copy this into your group chat for the ' + periodWord + 'ly review.</div><div class="summary-box" id="summaryText"></div></div>';
    return html;
  }

  function summaryText(periodMode){
    const isWeek = periodMode !== 'month';
    const periodStart = isWeek ? periodStartISO('week') : periodStartISO('month');
    const reportedFn = isWeek ? hasReportedThisWeek : hasReportedThisMonth;
    let lines = ['SPIRIT OF SADIQ — ' + (isWeek?'WEEKLY':'MONTHLY') + ' REPORT', new Date().toDateString(), ''];

    function teamStats(team){
      let allContacts = [];
      let daeenIds = [];
      team.forEach(m=>{
        allContacts = allContacts.concat(state.contactsM[m.id]||[]);
        const myDaeen = state.daeenRoster.filter(d=>d.missionaryId===m.id);
        daeenIds = daeenIds.concat(myDaeen.map(d=>d.id));
        myDaeen.forEach(d=> allContacts = allContacts.concat(state.contactsD[d.id]||[]));
      });
      const baiatsThisPeriod = allContacts.filter(c=>c.stage===3 && c.baiatDate && c.baiatDate>=periodStart).length;
      const activeContacts = allContacts.filter(isContactActive).length;
      const activeDaeen = daeenIds.filter(id=>isDaeenActive(id)).length;
      return {baiatsThisPeriod, activeContacts, totalContacts: allContacts.length, activeDaeen, totalDaeen: daeenIds.length};
    }

    const national = teamStats(state.missionaries);
    lines.push('NATIONAL OVERVIEW — Bai\u2019ats: ' + national.baiatsThisPeriod + ' | Contacts: ' + national.activeContacts + '/' + national.totalContacts + ' | Daeen: ' + national.activeDaeen + '/' + national.totalDaeen);
    lines.push('');

    const reported = state.missionaries.filter(m=>reportedFn(m.id));
    const notReported = state.missionaries.filter(m=>!reportedFn(m.id));
    lines.push('REPORTED (' + reported.length + '): ' + (reported.length ? reported.map(m=>m.name).join(', ') : 'None'));
    lines.push('DID NOT REPORT (' + notReported.length + '): ' + (notReported.length ? notReported.map(m=>m.name).join(', ') : 'None'));
    lines.push('');

    const leaders = state.missionaries.filter(m=>m.isRegionalLeader);
    if(leaders.length){
      lines.push('BY REGION:');
      leaders.forEach(rl=>{
        const team = state.missionaries.filter(m=>m.id===rl.id || m.regionalLeaderId===rl.id);
        const s = teamStats(team);
        lines.push((rl.regionLabel||'Unnamed region') + ' — Bai\u2019ats: ' + s.baiatsThisPeriod + ' | Contacts: ' + s.activeContacts + '/' + s.totalContacts + ' | Daeen: ' + s.activeDaeen + '/' + s.totalDaeen);
      });
    }

    return lines.join('\n');
  }

  // ---------- ADMIN app ----------

  function parseBulkImport(text){
    const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length);
    let rows = [];
    for(const line of lines){
      const parts = line.split(/\t|,/).map(p=>p.trim());
      if(rows.length===0 && parts[0] && parts[0].toLowerCase()==='name') continue;
      const name = parts[0]||'';
      if(!name) continue;
      const region = parts[1]||'';
      const missName = parts[2]||'';
      let missionaryId = '';
      if(missName){
        const mm = state.missionaries.find(m=>m.name.toLowerCase()===missName.toLowerCase());
        if(mm) missionaryId = mm.id;
      }
      rows.push({name, region, missName, missionaryId});
    }
    return rows;
  }
  function previewImport(){
    state.bulkImportPreview = parseBulkImport(state.bulkImportText);
    render();
  }
  async function confirmImport(){
    const rows = state.bulkImportPreview || [];
    const newDaeen = rows.map(row=>{
      const d = {id: uid(), name: row.name, region: row.region, missionaryId: row.missionaryId, notes:'', lastEngaged: null};
      state.contactsD[d.id] = [];
      return d;
    });
    await mutateSharedDaeenRoster(fresh=>{ newDaeen.forEach(d=> fresh.push(d)); });
    state.bulkImportPreview = null;
    state.bulkImportText = '';
    render();
  }
  function cancelImport(){ state.bulkImportPreview = null; render(); }

  async function confirmImportMissionaries(){
    const rows = state.bulkMissionaryPreview || [];
    await mutateSharedMissionaries(fresh=>{
      const byName = {};
      fresh.forEach(m=> byName[m.name.toLowerCase()] = m);
      rows.forEach(row=>{
        let m = byName[row.name.toLowerCase()];
        if(!m){
          m = {id: uid(), name: row.name, target: 10, groups: [], isRegionalLeader:false, regionalLeaderId:'', regionLabel:''};
          fresh.push(m);
          state.contactsM[m.id] = [];
          byName[row.name.toLowerCase()] = m;
        }
      });
      rows.forEach(row=>{
        const m = byName[row.name.toLowerCase()];
        if(!row.leaderName){
          m.isRegionalLeader = true;
          m.regionalLeaderId = '';
          if(row.regionLabel) m.regionLabel = row.regionLabel;
        } else {
          const leader = byName[row.leaderName.toLowerCase()];
          if(leader) m.regionalLeaderId = leader.id;
        }
      });
    });
    state.bulkMissionaryPreview = null;
    state.bulkMissionaryText = '';
    render();
  }

  async function addMissionaryAdmin(){
    const name = state.newName.trim();
    if(!name){ state.error='Enter a name.'; render(); return; }
    if(state.missionaries.find(m=>m.name.toLowerCase()===name.toLowerCase())){ state.error='That missionary already exists.'; render(); return; }
    const m = {id: uid(), name, target: 10, groups:[], isRegionalLeader:false, regionalLeaderId:''};
    state.contactsM[m.id] = [];
    await mutateSharedMissionaries(fresh=>{
      if(!fresh.find(x=>x.name.toLowerCase()===name.toLowerCase())) fresh.push(m);

    state.newName=''; state.error='';

    await mutateSharedMissionaries(fresh=>{

      if(idx>-1) fresh.splice(idx,1);
    });

    const m = state.missionaries.find(x=>x.id===id);
    if(!m) return;
    if(!confirm('Reset the password for ' + m.name + '? They\u2019ll be asked to set a new one next time they log in.')) return;

  async function reassignContactAdmin(contactId, sourceType, sourceId, newMissionaryId){
    if(!newMissionaryId) return;
    let contact = null;
    if(sourceType==='m'){
      const list = state.contactsM[sourceId] || [];
      const idx = list.findIndex(c=>c.id===contactId);
      if(idx>-1){ contact = list.splice(idx,1)[0]; }
      await saveContactsM(sourceId);
    } else {
      const list = state.contactsD[sourceId] || [];
      const idx = list.findIndex(c=>c.id===contactId);
      if(idx>-1){ contact = list.splice(idx,1)[0]; }
      await saveContactsD(sourceId);
    }
    if(!contact) return;
    if(!state.contactsM[newMissionaryId]) state.contactsM[newMissionaryId] = [];
    state.contactsM[newMissionaryId].push(contact);
    await saveContactsM(newMissionaryId);
    showToast('Contact moved');
    render();
  }
  async function updateBaiatStatusAdmin(contactId, sourceType, sourceId, newStage){
    const list = sourceType==='m' ? (state.contactsM[sourceId]||[]) : (state.contactsD[sourceId]||[]);
    const c = list.find(x=>x.id===contactId);
    if(!c) return;
    c.stage = parseInt(newStage);
    if(sourceType==='m') await saveContactsM(sourceId); else await saveContactsD(sourceId);
    showToast(c.stage===3 ? 'Status updated' : (c.name + ' removed from Bai\u2019ats list'));
    render();
  }

  function reachedOutYTD(contactsList){
    const yearStart = new Date(new Date().getFullYear(),0,1).toISOString().slice(0,10);
    const reached = (contactsList||[]).filter(c=> (c.lastContact && c.lastContact>=yearStart) || (c.history||[]).some(h=>h>=yearStart));
    return {reached: reached.length, total: (contactsList||[]).length};
  }
  function regionSortKey(m){
    const label = getMissionaryRegionLabel(m);
    if(!label) return 'zzz9_unassigned';
    if(/alt/i.test(label)) return 'zzz1_' + label;
    return label;
  }

  function renderAdminDaeen(){
    const weekStartD = periodStartISO('week');

      return (state.contactsD[d.id]||[]).some(c=>(c.history||[]).some(h=>h>=weekStartD));
    }
    const filtered = state.daeenRoster.filter(d=>{

    }).slice().sort((a,b)=>{
      const ca = contactedThisWeek(a), cb = contactedThisWeek(b);

  function buildBackupObject(){
    return {
      exportedAt: todayStr(),
      admins: state.admins,
      missionaries: state.missionaries,
      daeenRoster: state.daeenRoster,
      contactsM: state.contactsM,
      contactsD: state.contactsD,
      groupReports: state.groupReports,
      stageLabels: state.stageLabels
    };
  }
  function exportBackup(){
    const data = buildBackupObject();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'spirit-of-sadiq-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
  }
  async function importBackup(data){
    state.admins = data.admins || [];

    state.daeenRoster = data.daeenRoster || [];
    state.contactsM = data.contactsM || {};
    state.contactsD = data.contactsD || {};
    state.groupReports = data.groupReports || {};
    if(data.stageLabels) state.stageLabels = data.stageLabels;

    await saveAdmins();
    await saveMissionaries();
    await saveRoster();
    for(const id in state.contactsM) await saveContactsM(id);
    for(const id in state.contactsD) await saveContactsD(id);
    for(const id in state.groupReports) await saveGroupReports(id);
    await gsSet('stage-labels', JSON.stringify(state.stageLabels));

    state.error = '';
    render();
  }

  function getMissionaryRegionLabel(m){
    if(!m) return '';
    if(m.isRegionalLeader) return m.regionLabel || '';
    const rl = state.missionaries.find(x=>x.id===m.regionalLeaderId);
    return rl ? (rl.regionLabel || rl.name) : '';
  }

  function collectAllBaiats(){
    let rows = [];
    for(const m of state.missionaries){
      const region = getMissionaryRegionLabel(m);
      for(const c of (state.contactsM[m.id]||[])){
        if(c.stage===3 && c.baiatDate) rows.push({id:c.id, sourceType:'m', sourceId:m.id, missionary:m.name, region, contactName:c.name, baiatDate:c.baiatDate, reason:c.notes||'', age:c.baiatAge||'', city:c.baiatCity||'', formConfirmed:!!c.baiatFormConfirmed, additionalInfo:c.baiatAdditionalInfo||'', metInPerson:c.baiatMetInPerson||'', faithAtBaiat:c.baiatFaithAtBaiat||'', faithAtBirth:c.baiatFaithAtBirth||'', gender:c.baiatGender||'', ethnicity:c.baiatEthnicity||'', motivation:c.baiatMotivation||'', introducedBy:m.name, via:''});
      }
    }
    for(const d of state.daeenRoster){
      const m = state.missionaries.find(x=>x.id===d.missionaryId);
      const region = m ? getMissionaryRegionLabel(m) : '';
      for(const c of (state.contactsD[d.id]||[])){
        if(c.stage===3 && c.baiatDate) rows.push({id:c.id, sourceType:'d', sourceId:d.id, missionary: m?m.name:'(unassigned)', region, contactName:c.name, baiatDate:c.baiatDate, reason:c.notes||'', age:c.baiatAge||'', city:c.baiatCity||'', formConfirmed:!!c.baiatFormConfirmed, additionalInfo:c.baiatAdditionalInfo||'', metInPerson:c.baiatMetInPerson||'', faithAtBaiat:c.baiatFaithAtBaiat||'', faithAtBirth:c.baiatFaithAtBirth||'', gender:c.baiatGender||'', ethnicity:c.baiatEthnicity||'', motivation:c.baiatMotivation||'', introducedBy:d.name, via:d.name});
      }
    }
    return rows.sort((a,b)=> (b.baiatDate||'').localeCompare(a.baiatDate||''));
  }

  function renderAdminAllContacts(){
    const weekStartC = periodStartISO('week');
    function engagedThisWk(c){
      return (c.lastContact && c.lastContact>=weekStartC) || (c.history||[]).some(h=>h>=weekStartC);
    }
    let rows = [];
    state.missionaries.forEach(m=>{
      (state.contactsM[m.id]||[]).forEach(c=> rows.push({c, missionaryId:m.id, missionary:m.name, via:'', sourceType:'m', sourceId:m.id}));
    });
    state.daeenRoster.forEach(d=>{
      const m = state.missionaries.find(x=>x.id===d.missionaryId);
      (state.contactsD[d.id]||[]).forEach(c=> rows.push({c, missionaryId: m?m.id:'', missionary: m?m.name:'(unassigned)', via:d.name, sourceType:'d', sourceId:d.id}));
    });
    if(state.contactsFilterNotEngaged) rows = rows.filter(r=>!engagedThisWk(r.c));
    if(state.contactsFilterStage !== '' && state.contactsFilterStage !== undefined && state.contactsFilterStage !== null){
      rows = rows.filter(r=>r.c.stage === parseInt(state.contactsFilterStage));
    }
    if(state.searchText) rows = rows.filter(r=>r.c.name.toLowerCase().includes(state.searchText.toLowerCase()));
    rows.sort((a,b)=>{
      const ea = engagedThisWk(a.c), eb = engagedThisWk(b.c);
      if(ea !== eb) return ea ? 1 : -1;
      if(a.c.stage !== b.c.stage) return a.c.stage - b.c.stage;
      return a.c.name.localeCompare(b.c.name);
    });

    let html = '<div class="card"><h2>All Contacts (' + rows.length + ')</h2>';
    html += '<div class="muted" style="margin-bottom:10px;">Every contact, personal or via a Daeen, across the whole org — for reviewing who needs to move to the next stage. Change the Missionary dropdown to move a contact.</div>';
    html += '<div class="row" style="gap:16px; margin-bottom:10px; align-items:center;">';
    html += '<label style="font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:6px;"><input type="checkbox" id="contactsFilterNotEngaged" ' + (state.contactsFilterNotEngaged?'checked':'') + '> not contacted this week only</label>';
    html += '<label style="font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:6px;">Stage: <select id="contactsFilterStage"><option value="">All</option>';
    for(let i=0;i<4;i++) html += '<option value="' + i + '" ' + (String(state.contactsFilterStage)===String(i)?'selected':'') + '>' + escapeHtml(state.stageLabels[i]) + '</option>';
    html += '</select></label>';
    html += '</div>';
    html += '<div class="search-box"><input type="text" id="allContactsAdminSearch" placeholder="Search contacts…" value="' + escapeHtml(state.searchText) + '"></div>';
    if(!rows.length) html += '<div class="empty-state">No contacts match.</div>';
    else{
      html += '<table class="admin-table"><thead><tr><th>Name</th><th>Stage</th><th>Missionary</th><th>Via Daeen</th><th>This week</th></tr></thead><tbody>';
      rows.slice(0,200).forEach(r=>{
        const engaged = engagedThisWk(r.c);
        html += '<tr><td>' + escapeHtml(r.c.name) + '</td><td>' + escapeHtml(state.stageLabels[r.c.stage]) + '</td>';
        html += '<td><select data-action="reassignContactAdmin" data-contactid="' + r.c.id + '" data-sourcetype="' + r.sourceType + '" data-sourceid="' + r.sourceId + '"><option value="">unassigned</option>';
        state.missionaries.forEach(m=> html += '<option value="' + m.id + '" ' + (m.id===r.missionaryId?'selected':'') + '>' + escapeHtml(m.name) + '</option>');
        html += '</select></td>';
        html += '<td>' + (r.via?escapeHtml(r.via):'<span class="muted">—</span>') + '</td>';
        html += '<td>' + (engaged?'<span class="ok-badge">contacted</span>':'<span class="flag-badge">not yet</span>') + '</td></tr>';
      });
      html += '</tbody></table>';
      if(rows.length>200) html += '<div class="muted" style="margin-top:8px;">Showing the first 200 of ' + rows.length + ' — narrow with search or filters to find specific ones.</div>';
    }
    html += '</div>';
    return html;
  }

  // ---------- master render ----------

  function captureFocus(){
    const el = document.activeElement;
    if(!el || (el.tagName!=='INPUT' && el.tagName!=='TEXTAREA') || !el.id) return null;
    return {id: el.id, start: el.selectionStart, end: el.selectionEnd};
  }
  function restoreFocus(saved){
    if(!saved || !saved.id) return;
    const el = document.getElementById(saved.id);
    if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
      el.focus();
      if(typeof saved.start === 'number' && el.setSelectionRange){
        try{ el.setSelectionRange(saved.start, saved.end); }catch(e){}
      }
    }
  }
  function render(){
    const __focus = captureFocus();
    if(state.loading){ root.innerHTML = '<div class="app"><div class="loading">Loading…</div></div>'; return; }
    if(!state.me){ root.innerHTML = '<div class="app">' + renderSetup() + '</div>'; attachSetupHandlers(); restoreFocus(__focus); return; }

    const roleLabel = state.me.role==='missionary'?'Missionary':'National Access';
    let html = '<div class="app">';
    html += '<header class="top"><div class="brand">Spirit of Sadiq<small>Missionary Tabligh Reporting</small></div>';
    html += '<div class="identity"><span class="role-tag">' + roleLabel + '</span><div class="who">' + escapeHtml(state.me.name) + '</div><button id="switchBtn">switch person</button></div></header>';

    if(state.me.role === 'missionary'){
      const myRec = state.missionaries.find(m=>m.id===state.me.id);
      const isRL = myRec && myRec.isRegionalLeader;
      html += renderSummaryDashboard();
      html += '<nav class="tabs">';
      html += '<button class="' + (state.tab==='mine'?'active':'') + '" id="tabMine">My Contacts</button>';
      html += '<button class="' + (state.tab==='daeen'?'active':'') + '" id="tabDaeen">My Daeen</button>';
      html += '<button class="' + (state.tab==='allcontacts'?'active':'') + '" id="tabAllContacts">All Contacts</button>';
      if(isRL) html += '<button class="' + (state.tab==='region'?'active':'') + '" id="tabRegion">My Region</button>';
      html += '<button class="' + (state.tab==='leaderboard'?'active':'') + '" id="tabLeaderboard">Leaderboard</button>';
      html += '</nav>';
      if(state.tab==='daeen') html += renderDaeenTab();
      else if(state.tab==='allcontacts') html += renderAllContactsTab();
      else if(state.tab==='region' && isRL) html += renderRegionTab();
      else if(state.tab==='leaderboard') html += renderLeaderboardTab();
      else html += renderMine();
    } else {
      html += renderAdminApp();
    }

    html += '</div>';
    root.innerHTML = html;
    attachMainHandlers();
    restoreFocus(__focus);
  }
