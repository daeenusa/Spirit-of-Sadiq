    root.querySelectorAll('[data-action="dcLogToday"]').forEach(b=> b.addEventListener('click', ()=>{
      const daeenId=b.getAttribute('data-daeenid'), id=b.getAttribute('data-id');
      const c = (state.contactsD[daeenId]||[]).find(x=>x.id===id);
      if(c){ c.lastContact = todayStr(); c.method = b.getAttribute('data-method'); stampHistory(c, c.lastContact); saveContactsD(daeenId).then(render); }
    }));
    root.querySelectorAll('[data-action="dcAdvance"]').forEach(b=> b.addEventListener('click', ()=>{
      const daeenId=b.getAttribute('data-daeenid'), id=b.getAttribute('data-id');
      const c = (state.contactsD[daeenId]||[]).find(x=>x.id===id);
      if(c && c.stage<3){
        c.stage = c.stage+1;
        stampBaiat(c, c.lastContact);
        saveContactsD(daeenId).then(()=>{
          if(c.stage===3){ state.editingDaeenContactId = daeenId + ':' + c.id; render(); showToast('Alhamdulillah — Bai\u2019at recorded'); }
          else{ render(); showToast('Moved to ' + state.stageLabels[c.stage]); }
        });
      }
    }));
    root.querySelectorAll('[data-action="dcEdit"]').forEach(b=> b.addEventListener('click', ()=>{
      state.editingDaeenContactId = b.getAttribute('data-daeenid') + ':' + b.getAttribute('data-id');
      render();
    }));
    root.querySelectorAll('[data-action="dcDelete"]').forEach(b=> b.addEventListener('click', ()=>{
      if(!confirm('Delete this contact?')) return;
      const daeenId=b.getAttribute('data-daeenid'), id=b.getAttribute('data-id');
      state.contactsD[daeenId] = (state.contactsD[daeenId]||[]).filter(c=>c.id!==id);
      saveContactsD(daeenId).then(render);
    }));
    root.querySelectorAll('[data-action^="saveDaeenContact:"]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const daeenId = b.getAttribute('data-action').split(':')[1];
        const name = document.getElementById('fName').value.trim();
        const notes = document.getElementById('fNotes').value.trim();
        const stage = parseInt(document.getElementById('fStage').value);
        const lastContact = document.getElementById('fDate').value || todayStr();
        const method = document.getElementById('fMethod').value;
        const baiatInfo = document.getElementById('fBaiatInfo').value.trim();
        const nextFollowUp = document.getElementById('fNextFollowUp').value;
        const source = document.getElementById('fSource').value.trim();
        if(!name){ alert('Please enter a name.'); return; }
        const editId = b.getAttribute('data-editid');
        const list = state.contactsD[daeenId] || (state.contactsD[daeenId]=[]);
        if(editId){
          const c = list.find(x=>x.id===editId);
          if(c){ Object.assign(c, {name,notes,stage,lastContact,method,baiatInfo,nextFollowUp,source}); stampBaiat(c, lastContact); stampHistory(c, lastContact); }
          state.editingDaeenContactId = null;
        } else {
          const c = {id:uid(), name, notes, stage, lastContact, method, baiatInfo, nextFollowUp, source, created: todayStr()};
          stampBaiat(c, lastContact); stampHistory(c, lastContact);
          list.push(c);
          state.addingDaeenContact = null;
        }
        saveContactsD(daeenId).then(render);
      });
    });

    const copyBtn = document.getElementById('copySummaryBtn');
    if(copyBtn){
      copyBtn.addEventListener('click', ()=>{
        const text = weeklySummaryText();
        const card = document.getElementById('summaryCard');
        const box = document.getElementById('summaryText');
        card.style.display = 'block';
        box.textContent = text;
        if(navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
      });
    }

    const mNameInput = document.getElementById('mName');
    if(mNameInput) mNameInput.addEventListener('input', e=>{ state.newName = e.target.value; });
    const addMissionaryBtn = document.getElementById('addMissionaryBtn');
    if(addMissionaryBtn) addMissionaryBtn.addEventListener('click', addMissionaryAdmin);
    root.querySelectorAll('[data-action="removeMissionary"]').forEach(b=> b.addEventListener('click', ()=> removeMissionaryAdmin(b.getAttribute('data-id'))));
    root.querySelectorAll('[data-action="toggleRL"]').forEach(cb=> cb.addEventListener('change', ()=> toggleRegionalLeader(cb.getAttribute('data-id'))));
    root.querySelectorAll('[data-action="assignRL"]').forEach(sel=> sel.addEventListener('change', e=> assignRegionalLeader(sel.getAttribute('data-id'), e.target.value)));

    const bulkText = document.getElementById('bulkText');
    if(bulkText) bulkText.addEventListener('input', e=>{ state.bulkImportText = e.target.value; });
    const previewImportBtn = document.getElementById('previewImportBtn');
    if(previewImportBtn) previewImportBtn.addEventListener('click', previewImport);
    const confirmImportBtn = document.getElementById('confirmImportBtn');
    if(confirmImportBtn) confirmImportBtn.addEventListener('click', confirmImport);
    const cancelImportBtn = document.getElementById('cancelImportBtn');
    if(cancelImportBtn) cancelImportBtn.addEventListener('click', cancelImport);

    const bulkMissionaryTextArea = document.getElementById('bulkMissionaryTextArea');
    if(bulkMissionaryTextArea) bulkMissionaryTextArea.addEventListener('input', e=>{ state.bulkMissionaryText = e.target.value; });
    const previewMissionaryImportBtn = document.getElementById('previewMissionaryImportBtn');
    if(previewMissionaryImportBtn) previewMissionaryImportBtn.addEventListener('click', previewImportMissionaries);
    const confirmMissionaryImportBtn = document.getElementById('confirmMissionaryImportBtn');
    if(confirmMissionaryImportBtn) confirmMissionaryImportBtn.addEventListener('click', confirmImportMissionaries);
    const cancelMissionaryImportBtn = document.getElementById('cancelMissionaryImportBtn');
    if(cancelMissionaryImportBtn) cancelMissionaryImportBtn.addEventListener('click', cancelImportMissionaries);

    const filterUnassigned = document.getElementById('filterUnassigned');
    if(filterUnassigned) filterUnassigned.addEventListener('change', e=>{ state.daeenFilterUnassigned = e.target.checked; render(); });
    const adminDaeenSearch = document.getElementById('adminDaeenSearch');
    if(adminDaeenSearch) adminDaeenSearch.addEventListener('input', e=>{ state.searchText = e.target.value; render(); });
    root.querySelectorAll('[data-action="reassign"]').forEach(sel=> sel.addEventListener('change', e=>{ reassignDaeen(sel.getAttribute('data-id'), e.target.value); }));
    root.querySelectorAll('[data-action="removeDaeen"]').forEach(b=> b.addEventListener('click', ()=> removeDaeenAdmin(b.getAttribute('data-id'))));

    const exportBackupBtn = document.getElementById('exportBackupBtn');
    if(exportBackupBtn) exportBackupBtn.addEventListener('click', exportBackup);
    const importFileInput = document.getElementById('importFileInput');
    if(importFileInput){
      importFileInput.addEventListener('change', e=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev=>{
          let data;
          try{ data = JSON.parse(ev.target.result); }
          catch(err){ state.error = 'That file is not valid JSON.'; render(); return; }
          if(!confirm('This will REPLACE all current data with this backup (from ' + (data.exportedAt||'an unknown date') + '). Continue?')) { e.target.value=''; return; }
          importBackup(data);
        };
        reader.readAsText(file);
      });
    }
  }

  document.addEventListener('click', ()=>{
    document.querySelectorAll('.badge-tooltip.show').forEach(t=> t.classList.remove('show'));
  });

  loadAll();
})();
</script>
</body>
</html>
